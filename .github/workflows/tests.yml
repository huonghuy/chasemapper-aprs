name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the container base image; 3.13 is what development
        # happens on locally.
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The suite mocks every outbound request, so it must pass with no
        # network. Nothing here should reach the FAA endpoints.
        run: pytest -q

      - name: Byte-compile all modules
        run: python -m compileall -q chasemapper horusmapper.py log_parse.py log_playback.py
