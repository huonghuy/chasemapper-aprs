name: Container image

on:
  push:
    branches:
      - 'master'
      - 'UB-Spain'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - UB-Spain
  workflow_dispatch:

permissions:
     contents: write
     packages: write

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        platform: [linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Declare platform
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM=${platform//\//-}" >> $GITHUB_ENV

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: final
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          cache-from: type=gha,scope=${{ env.PLATFORM }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM }}

      # Tag the pushed digest directly under the desired tags. This replaces
      # what used to be a separate `merge` job that combined per-platform
      # digests into a multi-arch manifest. We only build for Raspberry Pi
      # (linux/arm64), so there is nothing to "merge" — a single-arch image
      # can be tagged in place.
      - name: Tag pushed image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.final.outputs.digest }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Inspect container image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
